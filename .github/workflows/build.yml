name: Android quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android SDK
        run: scripts/setup-android-sdk.sh
      - name: Record source and toolchain
        run: |
          mkdir -p build/reports
          {
            git rev-parse HEAD
            java -version 2>&1
            ./gradlew --version
            ./gradlew :app:dependencies --configuration kotlinCompilerClasspath
            ./gradlew :app:dependencies --configuration detektPlugins
            cat "$ANDROID_HOME/platforms/android-37.0/source.properties"
            cat "$ANDROID_HOME/build-tools/36.0.0/source.properties"
          } | tee build/reports/toolchain.txt
      - name: Check and build
        run: ./gradlew qualityGate :app:assembleDebug
      - name: Verify debug APK
        run: scripts/verify-apk.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/reports/apk-*
            build/reports/toolchain.txt
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports-${{ github.sha }}
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
